name: c_cascade
agent: {provider: gemini, model: gemini-flash-lite-latest}
# escalate to the stronger model on a SQL error or failed self-check (Phase 11 calibrates this)
cascade: {provider: gemini, model: gemini-flash-latest, escalate_on: [sql_error, empty_result, guard_reject]}
fallbacks: []
judge: {provider: mistral, model: mistral-large-latest}
judge_fallbacks: []
prompt: system_v1.md
params: {temperature: 0, seed: 42, max_tokens: 1200}
budgets: {max_tool_calls: 15, max_llm_calls: 6, max_seconds: 120, max_input_tokens: 20000, tool_output_tokens: 1200}
