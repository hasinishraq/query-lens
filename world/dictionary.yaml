# BazaarDW data dictionary. Generated from world/dictionary_src.py + the built DB by
# `python -m bazaar_world.dictionary_build`. Validated by `make dictionary`.
version: 1
tables:
  regions:
    description: The 8 administrative divisions of Bangladesh.
    domain: reference
    synonyms:
    - division
    - district
    - region
    - city
    - calendar
    - holiday
    - exchange rate
    - usd
    primary_key:
    - region_id
    row_count_full: 8
    notes: []
    joins:
    - cities.region_id = regions.region_id
    views:
    - analyst
    - support
    columns:
      region_id:
        description: Division id.
        type: INTEGER
        examples:
        - '1'
        - '2'
        - '3'
        views:
        - analyst
        - support
      name:
        description: Division name in English (e.g. Dhaka, Chattogram).
        type: VARCHAR
        examples:
        - Barishal
        - Chattogram
        - Dhaka
        views:
        - analyst
        - support
      name_bn:
        description: Division name in Bangla.
        type: VARCHAR
        examples:
        - খুলনা
        - চট্টগ্রাম
        - ঢাকা
        views:
        - analyst
        - support
      population_m:
        description: Population in millions.
        type: DOUBLE
        examples:
        - '11.0'
        - '12.2'
        - '17.4'
        views:
        - analyst
        - support
  cities:
    description: The 64 districts of Bangladesh; each belongs to one division (region).
    domain: reference
    synonyms:
    - division
    - district
    - region
    - city
    - calendar
    - holiday
    - exchange rate
    - usd
    primary_key:
    - city_id
    row_count_full: 64
    notes:
    - '''city'' in questions usually means district; ''division'' means region.'
    joins:
    - cities.region_id = regions.region_id
    - customers.city_id = cities.city_id
    - customer_addresses.city_id = cities.city_id
    - sellers.city_id = cities.city_id
    - warehouses.city_id = cities.city_id
    - shipment_events.city_id = cities.city_id
    views:
    - analyst
    - support
    columns:
      city_id:
        description: District id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        - support
      region_id:
        description: Division of the district.
        type: INTEGER
        examples:
        - '1'
        - '2'
        - '3'
        views:
        - analyst
        - support
        references: regions.region_id
      name:
        description: District name.
        type: VARCHAR
        examples:
        - Bagerhat
        - Bandarban
        - Barguna
        views:
        - analyst
        - support
      name_bn:
        description: District name in Bangla.
        type: VARCHAR
        examples:
        - কক্সবাজার
        - কিশোরগঞ্জ
        - কুড়িগ্রাম
        views:
        - analyst
        - support
      is_metro:
        description: True for the 11 metropolitan districts.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
      courier_zone:
        description: 'Delivery zone: inside_dhaka, dhaka_suburb or outside_dhaka (sets SLA and fee).'
        type: VARCHAR
        examples:
        - dhaka_suburb
        - inside_dhaka
        - outside_dhaka
        views:
        - analyst
        - support
  calendar_dim:
    description: One row per day of the data period 2024-01-01 to 2026-10-31 with calendar attributes.
    domain: reference
    synonyms:
    - division
    - district
    - region
    - city
    - calendar
    - holiday
    - exchange rate
    - usd
    primary_key:
    - date_key
    row_count_full: 1035
    notes:
    - Weekend is Friday and Saturday.
    - fiscal_year runs July to June and is named by its ending year (FY2026 = 2025-07-01 .. 2026-06-30).
    joins: []
    views:
    - analyst
    - support
    - finance
    columns:
      date_key:
        description: Date as integer YYYYMMDD.
        type: INTEGER
        examples:
        - '20240101'
        - '20240102'
        - '20240103'
        views:
        - analyst
        - support
        - finance
      date:
        description: Calendar date.
        type: DATE
        examples:
        - '2024-01-01'
        - '2024-01-02'
        - '2024-01-03'
        views:
        - analyst
        - support
        - finance
      year:
        description: Calendar year.
        type: INTEGER
        examples:
        - '2024'
        - '2025'
        - '2026'
        views:
        - analyst
        - support
        - finance
      quarter:
        description: Calendar quarter 1-4.
        type: INTEGER
        examples:
        - '1'
        - '2'
        - '3'
        views:
        - analyst
        - support
        - finance
      month:
        description: Month number 1-12.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        - support
        - finance
      month_name:
        description: Month name in English.
        type: VARCHAR
        examples:
        - April
        - August
        - December
        views:
        - analyst
        - support
        - finance
      week_of_year:
        description: ISO week number.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        - support
        - finance
      day_of_week:
        description: Day name (Monday..Sunday).
        type: VARCHAR
        examples:
        - Friday
        - Monday
        - Saturday
        views:
        - analyst
        - support
        - finance
      is_weekend:
        description: True on Friday and Saturday.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
        - finance
      is_holiday:
        description: True on public holidays and the 11.11 sale day.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
        - finance
      holiday_name:
        description: Holiday name, NULL on normal days.
        type: VARCHAR
        examples:
        - 11.11 Mega Sale
        - Christmas Day
        - Eid al-Adha
        views:
        - analyst
        - support
        - finance
      fiscal_year:
        description: Fiscal year (July-June) named by its ending year.
        type: INTEGER
        examples:
        - '2024'
        - '2025'
        - '2026'
        views:
        - analyst
        - support
        - finance
  currency_rates:
    description: Daily BDT per unit of foreign currency (USD only).
    domain: reference
    synonyms:
    - division
    - district
    - region
    - city
    - calendar
    - holiday
    - exchange rate
    - usd
    primary_key:
    - rate_date
    - currency
    row_count_full: 1035
    notes:
    - Join on rate_date = CAST(order_at AS DATE) and currency = orders.currency to convert.
    joins: []
    views:
    - analyst
    - finance
    columns:
      rate_date:
        description: Date of the rate.
        type: DATE
        examples:
        - '2024-01-01'
        - '2024-01-02'
        - '2024-01-03'
        views:
        - analyst
        - finance
      currency:
        description: Foreign currency code (USD).
        type: VARCHAR
        examples:
        - USD
        views:
        - analyst
        - finance
      bdt_per_unit:
        description: BDT for one unit of the currency.
        type: DOUBLE
        examples:
        - '108.843'
        - '108.9829'
        - '109.0079'
        views:
        - analyst
        - finance
      source:
        description: Rate source.
        type: VARCHAR
        examples:
        - bangladesh_bank
        views:
        - analyst
        - finance
  customers:
    description: Registered marketplace customers.
    domain: customers
    synonyms:
    - users
    - buyers
    - shoppers
    - segment
    - cohort
    - loyalty
    primary_key:
    - customer_id
    row_count_full: 10000
    notes:
    - Exclude is_deleted customers unless asked.
    - 'acquisition_source holds a marketing_campaigns.name for campaign-acquired customers; other values: organic, referral,
      search_ads, social_ads.'
    joins:
    - customers.city_id = cities.city_id
    - customer_addresses.customer_id = customers.customer_id
    - customer_segment_history.customer_id = customers.customer_id
    - loyalty_accounts.customer_id = customers.customer_id
    - orders.customer_id = customers.customer_id
    - promotion_redemptions.customer_id = customers.customer_id
    - web_sessions.customer_id = customers.customer_id
    - support_tickets.customer_id = customers.customer_id
    - product_reviews.customer_id = customers.customer_id
    views:
    - analyst
    - support
    columns:
      customer_id:
        description: Customer id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        - support
      full_name:
        description: Customer full name (PII).
        type: VARCHAR
        examples:
        - <name>
        views:
        - support
        pii: true
      email:
        description: Email address (PII).
        type: VARCHAR
        examples:
        - <email>
        views: []
        pii: true
      phone:
        description: Mobile number (PII), +8801XXXXXXXXX or 01XXXXXXXXX.
        type: VARCHAR
        examples:
        - <+8801XXXXXXXXX>
        views: []
        pii: true
      gender:
        description: female, male or other.
        type: VARCHAR
        examples:
        - female
        - male
        - other
        views: []
      birth_year:
        description: Year of birth.
        type: INTEGER
        examples:
        - '1960'
        - '1961'
        - '1962'
        views: []
      city_id:
        description: Home district of the customer.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        - support
        references: cities.city_id
      signup_at:
        description: Signup time (Dhaka local).
        type: TIMESTAMP
        examples:
        - '2022-06-01 07:18:21'
        - '2022-06-01 08:44:50'
        - '2022-06-01 10:17:14'
        views:
        - support
      signup_channel:
        description: app, web or social_commerce.
        type: VARCHAR
        examples:
        - app
        - social_commerce
        - web
        views:
        - analyst
      acquisition_source:
        description: How the customer was acquired (campaign name for campaign signups).
        type: VARCHAR
        examples:
        - AlwaysOn-facebook-202401
        - AlwaysOn-facebook-202402
        - AlwaysOn-facebook-202403
        views:
        - analyst
      is_verified:
        description: Phone verified.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
      preferred_language:
        description: bn or en.
        type: VARCHAR
        examples:
        - bn
        - en
        views:
        - analyst
        - support
      is_deleted:
        description: Soft-deleted account.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
      updated_at:
        description: Last profile update (Dhaka local).
        type: TIMESTAMP
        examples:
        - '2022-06-12 17:38:30'
        - '2022-06-12 20:23:18'
        - '2022-06-15 11:46:09'
        views: []
      signup_month:
        description: First day of the signup month (analyst view only; derived from signup_at).
        type: DATE
        examples: []
        views:
        - analyst
        derived: true
  customer_addresses:
    description: Delivery addresses of customers; orders point to the address used.
    domain: customers
    synonyms:
    - users
    - buyers
    - shoppers
    - segment
    - cohort
    - loyalty
    primary_key:
    - address_id
    row_count_full: 13000
    notes:
    - The division of an order is the division of its address city (orders.address_id -> customer_addresses.city_id -> cities.region_id).
    joins:
    - customer_addresses.customer_id = customers.customer_id
    - customer_addresses.city_id = cities.city_id
    - orders.address_id = customer_addresses.address_id
    views:
    - analyst
    - support
    columns:
      address_id:
        description: Address id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        - support
      customer_id:
        description: Owner customer.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        - support
        references: customers.customer_id
      city_id:
        description: District of the address.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        - support
        references: cities.city_id
      street_address:
        description: Street address (PII).
        type: VARCHAR
        examples:
        - <street>
        views: []
        pii: true
      postcode:
        description: Postcode (PII).
        type: VARCHAR
        examples:
        - <4 digits>
        views: []
        pii: true
      address_type:
        description: home, office or other.
        type: VARCHAR
        examples:
        - home
        - office
        - other
        views:
        - analyst
        - support
      is_default:
        description: Customer's default address.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
      created_at:
        description: Creation time (Dhaka local).
        type: TIMESTAMP
        examples:
        - '2022-06-01 07:18:21'
        - '2022-06-01 08:44:50'
        - '2022-06-01 10:17:14'
        views:
        - analyst
      is_deleted:
        description: Soft-deleted address.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
        - support
  customer_segment_history:
    description: SCD2 history of the CRM segment of each customer.
    domain: customers
    synonyms:
    - users
    - buyers
    - shoppers
    - segment
    - cohort
    - loyalty
    primary_key:
    - segment_hist_id
    row_count_full: 16000
    notes:
    - 'Join at event time: valid_from <= event_date < valid_to.'
    - Current rows have valid_to = 9999-12-31 and is_current = true.
    joins:
    - customer_segment_history.customer_id = customers.customer_id
    views:
    - analyst
    columns:
      segment_hist_id:
        description: History row id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      customer_id:
        description: Customer.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        references: customers.customer_id
      segment:
        description: new, regular, loyal, vip, at_risk or churned.
        type: VARCHAR
        examples:
        - at_risk
        - churned
        - loyal
        views:
        - analyst
      valid_from:
        description: First day the segment applies.
        type: DATE
        examples:
        - '2022-06-01'
        - '2022-06-02'
        - '2022-06-03'
        views:
        - analyst
      valid_to:
        description: Day the segment stops applying (exclusive); 9999-12-31 if current.
        type: DATE
        examples:
        - '2022-06-20'
        - '2022-06-26'
        - '2022-07-07'
        views:
        - analyst
      is_current:
        description: True for the current row.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
  loyalty_accounts:
    description: Loyalty programme membership, one per enrolled customer.
    domain: customers
    synonyms:
    - users
    - buyers
    - shoppers
    - segment
    - cohort
    - loyalty
    primary_key:
    - loyalty_id
    row_count_full: 4500
    notes: []
    joins:
    - loyalty_accounts.customer_id = customers.customer_id
    - loyalty_transactions.loyalty_id = loyalty_accounts.loyalty_id
    views:
    - analyst
    columns:
      loyalty_id:
        description: Loyalty account id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      customer_id:
        description: Member customer.
        type: INTEGER
        examples:
        - '1'
        - '100'
        - '1000'
        views:
        - analyst
        references: customers.customer_id
      tier:
        description: basic, silver, gold or platinum.
        type: VARCHAR
        examples:
        - basic
        - gold
        - platinum
        views:
        - analyst
      points_balance:
        description: Current points balance.
        type: INTEGER
        examples:
        - '0'
        - '1'
        - '10'
        views:
        - analyst
      enrolled_at:
        description: Enrolment time (Dhaka local).
        type: TIMESTAMP
        examples:
        - '2022-06-05 03:38:48'
        - '2022-06-25 22:12:00'
        - '2022-06-27 13:14:37'
        views:
        - analyst
      status:
        description: active or inactive.
        type: VARCHAR
        examples:
        - active
        - inactive
        views:
        - analyst
  loyalty_transactions:
    description: 'Loyalty point movements: earn, redeem, expire.'
    domain: customers
    synonyms:
    - users
    - buyers
    - shoppers
    - segment
    - cohort
    - loyalty
    primary_key:
    - loyalty_txn_id
    row_count_full: 36000
    notes:
    - points is always positive; txn_type gives the direction.
    joins:
    - loyalty_transactions.loyalty_id = loyalty_accounts.loyalty_id
    - loyalty_transactions.order_id = orders.order_id
    views:
    - analyst
    columns:
      loyalty_txn_id:
        description: Transaction id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      loyalty_id:
        description: Loyalty account.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        references: loyalty_accounts.loyalty_id
      order_id:
        description: Order that earned or redeemed points (NULL for expiries).
        type: INTEGER
        examples:
        - '10'
        - '10003'
        - '10004'
        views:
        - analyst
        references: orders.order_id
      txn_type:
        description: earn, redeem or expire.
        type: VARCHAR
        examples:
        - earn
        - expire
        - redeem
        views:
        - analyst
      points:
        description: Points moved (positive).
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      txn_at:
        description: Transaction time (Dhaka local).
        type: TIMESTAMP
        examples:
        - '2024-01-01 18:26:41'
        - '2024-01-02 00:07:30'
        - '2024-01-02 08:59:52'
        views:
        - analyst
      expires_at:
        description: Expiry of earned points (NULL for redeem/expire).
        type: TIMESTAMP
        examples:
        - '2025-01-02 04:19:59'
        - '2025-01-02 11:11:57'
        - '2025-01-02 17:23:43'
        views:
        - analyst
  categories:
    description: 3-level product category tree (level 1 = department, level 3 = leaf).
    domain: catalog
    synonyms:
    - product
    - item
    - sku
    - price
    - category
    - brand
    primary_key:
    - category_id
    row_count_full: 300
    notes:
    - Products point to leaf (level 3) categories; walk parent_category_id for higher levels.
    joins:
    - categories.parent_category_id = categories.category_id
    - products.category_id = categories.category_id
    views:
    - analyst
    columns:
      category_id:
        description: Category id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      parent_category_id:
        description: Parent category (NULL for level 1).
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '11'
        views:
        - analyst
        references: categories.category_id
      name:
        description: Category name.
        type: VARCHAR
        examples:
        - Abaya
        - Accessories
        - Alphabet Toys
        views:
        - analyst
      level:
        description: 1 = department, 2 = sub-category, 3 = leaf.
        type: INTEGER
        examples:
        - '1'
        - '2'
        - '3'
        views:
        - analyst
      path:
        description: Full path, e.g. 'Fashion > Men's Clothing > Panjabi'.
        type: VARCHAR
        examples:
        - Automotive
        - Automotive > Car Accessories
        - Automotive > Car Accessories > Car Care
        views:
        - analyst
  brands:
    description: Product brands.
    domain: catalog
    synonyms:
    - product
    - item
    - sku
    - price
    - category
    - brand
    primary_key:
    - brand_id
    row_count_full: 400
    notes: []
    joins:
    - products.brand_id = brands.brand_id
    views:
    - analyst
    columns:
      brand_id:
        description: Brand id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
      name:
        description: Brand name.
        type: VARCHAR
        examples:
        - Bobo
        - Bodexvia
        - Boka
        views:
        - analyst
      country:
        description: Brand country of origin.
        type: VARCHAR
        examples:
        - Bangladesh
        - China
        - India
        views:
        - analyst
      is_local:
        description: True for Bangladeshi brands.
        type: BOOLEAN
        examples:
        - 'false'
        - 'true'
        views:
        - analyst
  products:
    description: Products listed by sellers.
    domain: catalog
    synonyms:
    - product
    - item
    - sku
    - price
    - category
    - brand
    primary_key:
    - product_id
    row_count_full: 4000
    notes:
    - Exclude is_deleted products unless asked.
    - Product names are not unique (e.g. two different products are called 'Classic Panjabi').
    joins:
    - products.seller_id = sellers.seller_id
    - products.brand_id = brands.brand_id
    - products.category_id = categories.category_id
    - product_variants.product_id = products.product_id
    - product_reviews.product_id = products.product_id
    views:
    - analyst
    - support
    columns:
      product_id:
        description: Product id.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        - support
      seller_id:
        description: Seller listing the product.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        - support
        references: sellers.seller_id
      brand_id:
        description: Brand.
        type: INTEGER
        examples:
        - '1'
        - '10'
        - '100'
        views:
        - analyst
        references: brands.brand_id
      category_id:
        description: Leaf category.
        type: INTEGER
        examples:
        - '100'
        - '101'
        - '102'
        views:
        - analyst
        - support
        references: categories.category_id
      name:
        description: Product name (not unique).
        type: VARCHAR
        examples:
        - Bobo Classic Milk Powder 871
        - Bobo Classic Streaming Devices 929
        - Bobo Fresh Rugged Phones 583
        views:
        - analyst
        - support
      description:
        description: Short product description.
        type: VARCHAR
        examples:
        - Abaya by Dexmiko. Essential quality, ideal for everyday use.
        - Abaya by Dexvezen. Smart quality, ideal for everyday use.
        - Abaya by Dobo. Fresh quality, ideal for everyday use.
        views:
        - analyst
      list_price_bdt:
