  sql: WITH ss AS (SELECT DISTINCT order_id, seller_id FROM order_items), s AS ( SELECT sh.shipment_id, sh.order_id, sh.promised_date,
    CAST(sh.delivered_at_utc + INTERVAL 6 HOUR AS DATE) AS delivered_date FROM shipments sh JOIN orders o ON o.order_id =
    sh.order_id WHERE sh.status = 'delivered' AND sh.delivered_at_utc IS NOT NULL AND NOT o.is_deleted) SELECT se.name, COUNT(DISTINCT
    s.shipment_id) AS n_shipments, AVG(CASE WHEN s.delivered_date > s.promised_date THEN 1.0 ELSE 0.0 END) AS late_rate FROM
