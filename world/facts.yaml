  sql: WITH v AS (SELECT o.customer_id, o.order_at FROM orders o WHERE NOT o.is_deleted AND o.status NOT IN ('cancelled',
    'canceled', 'payment_failed')), f AS (SELECT customer_id, MIN(order_at) AS first_at FROM v GROUP BY 1), rep AS ( SELECT
    f.customer_id, MAX(CASE WHEN v.order_at > f.first_at AND v.order_at <= f.first_at + INTERVAL 90 DAY THEN 1 ELSE 0 END)
    AS repeated FROM f JOIN v ON v.customer_id = f.customer_id GROUP BY 1) SELECT c.acquisition_source AS campaign, COUNT(*)
    AS n_customers, AVG(rep.repeated) AS repeat_rate_90d FROM customers c JOIN rep ON rep.customer_id = c.customer_id JOIN
    marketing_campaigns m ON m.name = c.acquisition_source WHERE NOT c.is_deleted GROUP BY 1 HAVING COUNT(*) >= {min_volume}
    ORDER BY repeat_rate_90d DESC, campaign
