        rest_of_august: 0.8977
  sql: SELECT CASE WHEN d BETWEEN DATE '2025-08-12' AND DATE '2025-08-14' THEN 'window' ELSE 'rest_of_august' END AS period,
    SUM(CASE WHEN status = 'captured' THEN 1 ELSE 0 END) * 1.0 / SUM(CASE WHEN status IN ('captured', 'failed') THEN 1 ELSE
    0 END) AS success_rate, MIN(daily_rate) AS min_daily_rate FROM ( SELECT CAST(created_at_utc + INTERVAL 6 HOUR AS DATE)
    AS d, status, SUM(CASE WHEN status = 'captured' THEN 1 ELSE 0 END) OVER (PARTITION BY CAST(created_at_utc + INTERVAL 6
    HOUR AS DATE)) * 1.0 / SUM(CASE WHEN status IN ('captured', 'failed') THEN 1 ELSE 0 END) OVER (PARTITION BY CAST(created_at_utc
    + INTERVAL 6 HOUR AS DATE)) AS daily_rate FROM payments WHERE method = 'bkash') x WHERE d BETWEEN DATE '2025-08-01' AND
    DATE '2025-08-31' GROUP BY 1 ORDER BY 1
